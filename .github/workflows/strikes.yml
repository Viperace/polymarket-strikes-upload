name: Backfill 5m strikes

# Daily at 01:00 UTC (09:00 Singapore). Also runnable from the Actions tab.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      asset_mode:
        description: "Which underlyings to backfill"
        type: choice
        options: [both, btc, eth]
        default: both

permissions:
  contents: write   # only for the monthly keep-alive commit
  id-token: write   # lets the job assume your AWS role without stored keys

concurrency:
  group: strikes
  cancel-in-progress: false

env:
  FILES: "btc_5m_strikes.csv eth_5m_strikes.csv"
  # AWS_ROLE_ARN and S3_BUCKET are repository *secrets* so they are masked in
  # the (public) run logs. Without AWS_ROLE_ARN the run skips S3 and attaches
  # the CSVs to the run as an artifact instead.
  USE_S3: ${{ secrets.AWS_ROLE_ARN != '' }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_PREFIX: ${{ vars.S3_PREFIX || 'bau/v1/sources/polymarket/polymarket_reference' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    # A first run that has to rebuild a whole file from START_DATE takes ~2 h.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Connect to AWS
        if: env.USE_S3 == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Load current CSVs (S3, else repo seed)
        run: bash scripts/load_inputs.sh

      - name: Run notebook
        env:
          STRIKES_DIR: ${{ github.workspace }}/data
          CREATE_BACKUP: "0"
          ASSET_MODE: ${{ inputs.asset_mode || 'both' }}
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=12000 \
            --output "$RUNNER_TEMP/executed.ipynb" \
            crawl_5m_strike_chainlink_twap60_indicator.ipynb

      - name: Upload CSVs to S3
        if: env.USE_S3 == 'true'
        run: bash scripts/upload_outputs.sh

      - name: Run summary
        if: always()
        run: python scripts/summary.py data >> "$GITHUB_STEP_SUMMARY"

      - name: Keep CSVs as run artifact (no-S3 mode)
        if: env.USE_S3 != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: strikes-csv
          path: data/*.csv
          retention-days: 14
          if-no-files-found: error

      - name: Keep executed notebook for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebook
          path: ${{ runner.temp }}/executed.ipynb
          retention-days: 14
          if-no-files-found: ignore

      # Public repos pause scheduled workflows after 60 days without repository
      # activity, so the schedule commits a timestamp roughly once a month.
      - name: Keep schedule alive
        if: success() && github.event_name == 'schedule'
        run: |
          f=.github/heartbeat
          last=$(cat "$f" 2>/dev/null || echo 1970-01-01)
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          if [ "$age_days" -ge 25 ]; then
            date -u +%F > "$f"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f"
            git commit -m "Keep scheduled workflow active ($(date -u +%F))"
            git push
          else
            echo "Last keep-alive $last ($age_days days ago); nothing to do."
          fi
